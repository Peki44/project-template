services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped

  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 3000
        CMD ["npm", "run", "dev", "--", "-p", "3000", "-H", "0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_PB_URL=http://localhost:8090
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pb_data:
